# Nom de l'application (C'est ce nom qui s'affichera dans Eureka)
spring.application.name=reclamation-service

# Port du serveur
server.port=8080

# Connexion à MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/money_minder_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate : création automatique des tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuration Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Optionnel : Améliore la rapidité de détection dans Eureka lors du développement
eureka.instance.prefer-ip-address=true