# Nom du microservice
spring.application.name=reclamation
spring.config.import=optional:configserver:http://localhost:8099

server.port=8082

# Connexion MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/gestion_reclamation?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
springdoc.swagger-ui.path=/swagger-ui.html
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/